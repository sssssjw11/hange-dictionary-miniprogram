name: Check mini program
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r server/requirements.txt
      - run: node scripts/compile.js
      - run: python scripts/verify_project.py
      - run: python scripts/audit_public.py
      - run: npm test
      - run: python tests/test_server.py
